<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Jannie</title>
    
    <!-- Fonts: Inter for clean text, Playfair Display for elegant headings -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAF9; /* warm off-white (tailwind stone-50) */
            color: #292524; /* dark stone for soft contrast */
            -webkit-tap-highlight-color: transparent;
        }
        
        h1, h2, .font-serif-elegant {
            font-family: 'Playfair Display', serif;
        }

        /* Smooth fade transitions */
        .fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-out;
        }
        
        .fade-in {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        /* Clean Glassmorphism for the player */
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        /* Initial state for main content */
        #main-content {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        /* Image hover effects */
        .img-card {
            break-inside: avoid;
            margin-bottom: 1rem;
        }
        .img-card img {
            transition: transform 0.5s ease;
        }
        .img-card:hover img {
            transform: scale(1.02);
        }
    </style>
</head>
<body class="antialiased selection:bg-stone-200">

    <!-- Intro Screen (For Audio Permission) -->
    <div id="intro-screen" class="fixed inset-0 z-50 bg-stone-100 flex flex-col items-center justify-center p-6 text-center">
        <div class="mb-8">
            <i class="ph-light ph-envelope-simple-open text-5xl text-stone-400 mb-4 inline-block"></i>
            <h1 class="font-serif-elegant text-3xl mb-2 text-stone-800">For Jannie</h1>
            <p class="text-stone-500 text-sm uppercase tracking-widest">May 16</p>
        </div>
        <button id="start-btn" class="px-8 py-3 bg-stone-800 text-stone-50 rounded-full hover:bg-stone-700 transition-colors shadow-lg active:scale-95 flex items-center gap-2">
            <span>Tap to open</span>
            <i class="ph ph-arrow-right"></i>
        </button>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="min-h-screen pb-32">
        
        <!-- Header / Greeting Section -->
        <header class="pt-20 pb-12 px-6 max-w-lg mx-auto text-center">
            <p class="text-stone-400 text-xs font-medium tracking-[0.2em] uppercase mb-4">Happy Birthday</p>
            <h1 class="text-5xl font-serif-elegant text-stone-800 mb-6 leading-tight">
                Welcome to<br>the 20s life,<br>
                <span class="italic text-stone-600">Jannie.</span>
            </h1>
            
            <div class="w-12 h-px bg-stone-300 mx-auto mb-8"></div>
            
            <p class="text-stone-600 text-base leading-relaxed px-4">
                Wishing you a wonderful year ahead filled with joy, growth, and amazing memories. May this new chapter bring you happiness and all the simple things that make life beautiful. Have the best day!
            </p>
        </header>

        <!-- Photo Gallery (Masonry Grid) -->
        <section class="px-4 max-w-2xl mx-auto">
            <!-- Tailwind CSS Columns for pure CSS masonry -->
            <div class="columns-2 gap-4 space-y-4">
                <!-- Image 1 -->
                <div class="img-card rounded-xl overflow-hidden shadow-sm bg-white">
                    <img src="https://github.com/Lorheng/jannie/blob/main/IMG_4658.JPG?raw=true" alt="Jannie" class="w-full h-auto object-cover" loading="lazy">
                </div>
                <!-- Image 2 -->
                <div class="img-card rounded-xl overflow-hidden shadow-sm bg-white">
                    <img src="https://github.com/Lorheng/jannie/blob/main/IMG_4657.JPG?raw=true" alt="Jannie" class="w-full h-auto object-cover" loading="lazy">
                </div>
                <!-- Image 3 -->
                <div class="img-card rounded-xl overflow-hidden shadow-sm bg-white">
                    <img src="https://github.com/Lorheng/jannie/blob/main/IMG_4655.JPG?raw=true" alt="Jannie" class="w-full h-auto object-cover" loading="lazy">
                </div>
                <!-- Image 4 -->
                <div class="img-card rounded-xl overflow-hidden shadow-sm bg-white">
                    <img src="https://github.com/Lorheng/jannie/blob/main/IMG_4656.JPG?raw=true" alt="Jannie" class="w-full h-auto object-cover" loading="lazy">
                </div>
                <!-- Image 5 -->
                <div class="img-card rounded-xl overflow-hidden shadow-sm bg-white">
                    <img src="https://github.com/Lorheng/jannie/blob/main/IMG_4653.JPG?raw=true" alt="Jannie" class="w-full h-auto object-cover" loading="lazy">
                </div>
                <!-- Image 6 -->
                <div class="img-card rounded-xl overflow-hidden shadow-sm bg-white">
                    <img src="https://github.com/Lorheng/jannie/blob/main/IMG_4660.JPG?raw=true" alt="Jannie" class="w-full h-auto object-cover" loading="lazy">
                </div>
                <!-- Image 7 -->
                <div class="img-card rounded-xl overflow-hidden shadow-sm bg-white">
                    <img src="https://github.com/Lorheng/jannie/blob/main/IMG_4654.JPG?raw=true" alt="Jannie" class="w-full h-auto object-cover" loading="lazy">
                </div>
                <!-- Image 8 -->
                <div class="img-card rounded-xl overflow-hidden shadow-sm bg-white">
                    <img src="https://github.com/Lorheng/jannie/blob/main/IMG_4659.JPG?raw=true" alt="Jannie" class="w-full h-auto object-cover" loading="lazy">
                </div>
                <!-- Image 9 -->
                <div class="img-card rounded-xl overflow-hidden shadow-sm bg-white">
                    <img src="https://github.com/Lorheng/jannie/blob/main/IMG_4650.JPG?raw=true" alt="Jannie" class="w-full h-auto object-cover" loading="lazy">
                </div>
                <!-- Image 10 -->
                <div class="img-card rounded-xl overflow-hidden shadow-sm bg-white">
                    <img src="https://github.com/Lorheng/jannie/blob/main/Gemini_Generated_Image_ishjwnishjwnishj.png?raw=true" alt="Jannie" class="w-full h-auto object-cover" loading="lazy">
                </div>
            </div>
        </section>

        <div class="text-center mt-16 mb-8 text-stone-400">
            <i class="ph-fill ph-heart text-xl"></i>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="bg-audio" preload="auto" crossorigin="anonymous">
        <source src="https://raw.githubusercontent.com/Lorheng/jannie/main/About%20You-The%201975.mp3" type="audio/mpeg">
    </audio>

    <!-- Floating Minimalist Player -->
    <div id="music-player" class="fixed bottom-0 left-0 w-full glass-nav px-6 py-4 flex items-center justify-between z-40 transform translate-y-full transition-transform duration-700">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-stone-200 flex items-center justify-center overflow-hidden">
                <i class="ph ph-music-notes text-stone-500 text-lg"></i>
            </div>
            <div>
                <p class="text-sm font-medium text-stone-800">About You</p>
                <p class="text-xs text-stone-500">The 1975</p>
            </div>
        </div>
        
        <button id="play-pause-btn" class="w-12 h-12 flex items-center justify-center bg-stone-800 hover:bg-stone-700 rounded-full transition-colors text-white shadow-md active:scale-95">
            <i class="ph-fill ph-play text-xl" id="play-icon"></i>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // DOM Elements
            const introScreen = document.getElementById('intro-screen');
            const mainContent = document.getElementById('main-content');
            const startBtn = document.getElementById('start-btn');
            const musicPlayer = document.getElementById('music-player');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const playIcon = document.getElementById('play-icon');
            const bgAudio = document.getElementById('bg-audio');

            let isPlaying = false;

            // --- Intro & Audio Start Logic ---
            startBtn.addEventListener('click', () => {
                // Fade out intro
                introScreen.classList.add('fade-out');
                
                // Show main content
                setTimeout(() => {
                    introScreen.style.display = 'none';
                    mainContent.classList.add('fade-in');
                }, 800); // Wait for fade out

                // Slide up player
                setTimeout(() => {
                    musicPlayer.classList.remove('translate-y-full');
                }, 1000);

                // Setup and Play Audio from 23 seconds
                bgAudio.currentTime = 23;
                playAudio();
            });

            // --- Audio Controls & UI Updates ---
            function playAudio() {
                bgAudio.play().then(() => {
                    isPlaying = true;
                    updateIcon();
                }).catch(error => {
                    console.log("Autoplay blocked or audio failed to load:", error);
                });
            }

            function updateIcon() {
                if (isPlaying) {
                    playIcon.classList.remove('ph-play');
                    playIcon.classList.add('ph-pause');
                } else {
                    playIcon.classList.remove('ph-pause');
                    playIcon.classList.add('ph-play');
                }
            }

            // Play/Pause Button Toggle
            playPauseBtn.addEventListener('click', () => {
                if (isPlaying) {
                    bgAudio.pause();
                    isPlaying = false;
                } else {
                    bgAudio.play();
                    isPlaying = true;
                }
                updateIcon();
            });

            // Handle track ending (optional: loop it)
            bgAudio.addEventListener('ended', () => {
                bgAudio.currentTime = 0; // Or reset to 23s if you want it to loop from that specific point!
                bgAudio.play();
            });
            
            // Ensure UI stays synced if audio pauses/plays unexpectedly
            bgAudio.addEventListener('pause', () => { isPlaying = false; updateIcon(); });
            bgAudio.addEventListener('play', () => { isPlaying = true; updateIcon(); });
        });
    </script>
</body>
</html>
